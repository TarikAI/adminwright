name: Bug report
description: The validator, or a command, behaved incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If you found a way to make a **mock-backed manifest validate cleanly**, that is the
        highest-value report this project can receive. Please use the "Validator bypass"
        template instead.
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact invocation, including the profile and phase.
      render: shell
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations: {required: true}
  - type: textarea
    id: manifest
    attributes:
      label: Minimal manifest that reproduces it
      description: Trim it to the smallest thing that still shows the problem.
      render: json
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
    validations: {required: true}
