name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The scripts themselves are standard library only. These two are test-time
      # oracles: PyYAML checks that every agent's frontmatter is strictly valid,
      # jsonschema checks the manifest schema against everything the tool writes.
      # Both tests skip, rather than fail, where the package is absent.
      - name: Install test-time checkers
        run: python -m pip install pyyaml jsonschema
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8

      - name: Run golden-fixture evals
        run: python evals/run.py
        env:
          PYTHONIOENCODING: utf-8

  # The console encoding is the one thing the suite must never hide. Every CLI test
  # already runs the script under a cp1252 console (tests/cli_helpers.py); this leg
  # also makes the PARENT process cp1252, so the harness's own I/O cannot mask a
  # crash either. Windows is where cp1252 is the default for a piped stdout.
  console-encoding:
    name: tests under a cp1252 console (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pyyaml jsonschema
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: cp1252

  # Runs RealCliSmoke (tests/test_code_review.py) against the real `ocr` CLI: every
  # subcommand and flag the bridge passes must exist in `ocr ... --help`, and real
  # reviews, a real scan and a real delegate diff against a stand-in LLM endpoint on
  # 127.0.0.1 must end in the verdicts the bridge promises (complete recorded, partial
  # recorded with the failed file named). No secrets and no network beyond npm.
  # Two legs: the version ocr-advisory.yml pins (its action SHA and ocr_version; the
  # AdvisoryPins test keeps this leg on the same release), which must pass, and npm's
  # latest, which may fail: it is a third-party release nobody has reviewed yet, so
  # a red latest leg is the early warning, not a broken build.
  ocr-smoke:
    name: real ocr smoke (${{ matrix.ocr }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.ocr == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        ocr: ["1.9.6", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g "@alibaba-group/open-code-review@${{ matrix.ocr }}"
        env:
          OCR_NO_UPDATE: "1"
      - run: ocr --version
        env:
          OCR_NO_UPDATE: "1"
      # ADMINWRIGHT_REAL_OCR makes a missing `ocr` a failure rather than a skip.
      - name: Run the real-binary smoke tests
        run: python -m unittest discover -s tests -p "test_code_review.py" -k RealCliSmoke -v
        env:
          ADMINWRIGHT_REAL_OCR: "1"
          OCR_NO_UPDATE: "1"
          PYTHONIOENCODING: utf-8

  integrity:
    name: skill integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manifest schema and template are valid JSON and agree
        run: |
          python - <<'PY'
          import json, pathlib, sys
          schema = json.loads(pathlib.Path("assets/admin-console.manifest.schema.json").read_text())
          template = json.loads(pathlib.Path("assets/admin-console.manifest.template.json").read_text())
          missing = [k for k in schema["required"] if k not in template]
          if missing:
              sys.exit("template missing schema-required keys: " + ", ".join(missing))
          print("schema and template agree")
          PY

      - name: Every internal link resolves
        run: |
          python - <<'PY'
          import re, pathlib, sys
          broken = []
          for f in pathlib.Path(".").rglob("*.md"):
              if ".github" in f.parts:
                  continue
              for m in re.finditer(r"\[([^\]]+)\]\(([^)]+)\)", f.read_text(encoding="utf-8")):
                  target = m.group(2).split("#")[0].strip()
                  if not target or target.startswith(("http", "mailto")):
                      continue
                  if not (f.parent / target).exists():
                      broken.append(f"{f.as_posix()} -> {target}")
          if broken:
              sys.exit("broken links:\n  " + "\n  ".join(broken))
          print("no broken links")
          PY

      # Compares postgres.sql with the five translations: tables, columns and their types,
      # CHECK constraints (names, enum value sets, expressions by logical equivalence), index
      # names and definitions (UNIQUE, key columns and expressions, WHERE), single-column
      # UNIQUEs, foreign-key ON DELETE actions, and the text of every trigger and function.
      # The same file runs in the `test` job; it is stdlib-only and needs no database.
      - name: Schema translations cover the same tables
        run: python -m unittest discover -s tests -p "test_core_schema.py" -v

      - name: Reference files stay within budget
        run: |
          python - <<'PY'
          import pathlib, sys
          over = []
          for f in sorted(pathlib.Path("references").glob("*.md")):
              n = len(f.read_text(encoding="utf-8").splitlines())
              if n > 450:
                  over.append(f"{f.name}: {n}")
          if over:
              sys.exit("over the 450-line ceiling:\n  " + "\n  ".join(over))
          print("all references within ceiling")
          PY

  core-schema-postgres:
    name: core schema on PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Django 6.1 needs PostgreSQL 15+, so the PostgreSQL 14 leg runs the Django
        # translation on Django 5.2 LTS (which supports 14) rather than skipping it.
        include:
          - postgres: "14"
            django: "django>=5.2,<6"
          - postgres: "16"
            django: "django>=6,<7"
          # 18 reports ON DELETE RESTRICT refusals as 23001, not 23503: keep it in the matrix.
          - postgres: "18"
            django: "django>=6,<7"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # libpq variables: read by psql and by the tests. PGDATABASE is deliberately unset;
      # each step or test names its own database.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      ADMINWRIGHT_PG_TEST: "1"
      ADMINWRIGHT_NPM_TEST: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Network-bound steps get their own timeouts, so a stalled mirror fails the step that
      # stalled instead of eating the job's 20 minutes.
      - name: psql is available
        timeout-minutes: 5
        run: |
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          psql --version

      - name: Apply postgres.sql
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE core_schema"
          psql -d core_schema -v ON_ERROR_STOP=1 -f assets/admin-core-schema/postgres.sql

      # The SQL block under "Verifying the install" in the schema README. It raises (and psql
      # exits non-zero) if a control is missing or refuses for the wrong reason, and it rolls
      # everything back, so it also runs against the database the next steps reuse.
      - name: Run the README verification SQL
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); import _core_schema_pg as p; open('verify.sql', 'w', encoding='utf-8').write(p.readme_verification_sql())"
          psql -d core_schema -v ON_ERROR_STOP=1 -f verify.sql

      # Django is installed only for the Django translation test; nothing in the skill needs it.
      # Majors are pinned (the matrix picks Django's); the npm tools are pinned in their tests.
      - name: Install Django and psycopg for the translation test
        timeout-minutes: 5
        run: python -m pip install "${{ matrix.django }}" "psycopg[binary]>=3.1,<4"

      # test_core_schema_db.py     postgres.sql: verification is not vacuous, scrub paths, temp-table
      #                            shadowing, grants.sql, concurrent chain writers
      # test_core_schema_django.py django_models.py: check, sqlmigrate, migrate with the docstring's
      #                            trigger migration, verification, ORM timestamps, index set
      # test_core_schema_prisma.py prisma.schema on prisma@7: validate, no SET NULL, DDL + prisma_raw.sql, verification
      # test_core_schema_drizzle.py drizzle.ts via drizzle-kit@0.31: generate, tsc, Integrity section, verification
      - name: Core schema tests against the service container
        timeout-minutes: 15
        run: python -m unittest discover -s tests -p "test_core_schema_*.py" -v

  # Claude Code's own plugin check: the manifest, the marketplace entry and every agent's
  # frontmatter as Claude Code parses it. An agent whose frontmatter fails to parse still
  # loads, under its file name with every field ignored (disallowedTools included), so a
  # broken reviewer guard would otherwise be silent. Non-blocking until it has a green run
  # history: it installs the CLI from npm, and the `version` warning is expected (the
  # plugin deliberately has none; see tests/test_plugin_packaging.py).
  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
        timeout-minutes: 5
      - run: claude plugin validate .claude-plugin/plugin.json
        env:
          DISABLE_AUTOUPDATER: "1"
