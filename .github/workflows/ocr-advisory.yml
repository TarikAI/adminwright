name: OCR advisory review

# Non-blocking advisory code review of pull requests with Alibaba Open Code
# Review (https://github.com/alibaba/open-code-review). Posts findings as PR
# comments only; it never gates a merge and no step here is a required check.
# The job always runs; its review step is skipped, and a notice step says so,
# until the OCR_LLM_* secrets exist — see CONTRIBUTING.md "Advisory OCR review".
#
# Secrets: an `if` cannot read the secrets context (a step-level `if` can read
# env), so the job env holds only HAS_OCR, a true/false derived from the
# secrets. The secret values go to the one step that needs them, through its
# `with:`. The action is a composite action (no automatic INPUT_* variables)
# and maps them into env for its own `ocr review` step only, so checkout,
# setup-node, the npm install and its postinstall script, and the artifact
# upload never see the token.
#
# Supply chain: the action is pinned to a release SHA, and its ocr_version input
# pins the npm package it installs (the action defaults to `latest`, which would
# fetch whatever was published last on every run). Keep the two on the same
# release and bump them together by hand: Dependabot ignores this action
# (.github/dependabot.yml), because it would move the SHA and leave ocr_version
# behind, and tests/test_code_review.py (AdvisoryPins) checks that the SHA's
# version comment, ocr_version and the ocr-smoke CI pin agree. OCR_NO_UPDATE=1
# (job env, inherited by the action's steps) stops the ocr launcher's
# background self-update, which would otherwise run `npm i -g` for the newest
# version even after the pin. Residual exposure is documented in
# INTEGRATIONS.md "Advisory OCR review": the version is pinned, not an
# integrity hash, and the package's native binary comes from a per-platform
# optional package or the release's GitHub assets.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ocr-advisory:
    name: ocr advisory review
    runs-on: ubuntu-latest
    env:
      # 'true' or 'false', never a secret value.
      HAS_OCR: ${{ secrets.OCR_LLM_URL != '' && secrets.OCR_LLM_TOKEN != '' }}
      OCR_NO_UPDATE: '1'
    steps:
      - name: Notice when secrets are absent
        if: ${{ env.HAS_OCR != 'true' }}
        run: >
          echo "OCR_LLM_URL/OCR_LLM_TOKEN secrets are not configured;
          skipping the advisory OCR review."

      - name: Advisory OCR review
        if: ${{ env.HAS_OCR == 'true' }}
        uses: alibaba/open-code-review@24c2dd0cde63f56b19079ccf128cf88ab523cadf # v1.9.6
        with:
          ocr_version: '1.9.6' # npm package version; same release as the action pin above
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL || 'agnes-2.0-flash' }}
          llm_use_anthropic: ${{ vars.OCR_USE_ANTHROPIC || 'false' }}
          rule: assets/adminwright-ocr-rules.json
          language: English
          upload_artifacts: 'true'
