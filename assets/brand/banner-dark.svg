<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Adminwright. Agents build the admin console; the gate decides if it is real.">
  <title>Adminwright</title>
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="#0d1117"/>

  <g transform="translate(84 116)">
    <rect x="0" y="0" width="128" height="104" rx="14" fill="url(#sweep)" opacity="0.14"/>
    <rect x="0.75" y="0.75" width="126.5" height="102.5" rx="13.25" fill="none" stroke="url(#sweep)" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="128" y2="28" stroke="url(#sweep)" stroke-width="1.5" opacity="0.55"/>
    <circle cx="16" cy="14" r="4" fill="url(#sweep)"/>
    <circle cx="30" cy="14" r="4" fill="url(#sweep)" opacity="0.55"/>
    <circle cx="44" cy="14" r="4" fill="url(#sweep)" opacity="0.3"/>
    <path d="M36 66 l16 17 l34 -37" fill="none" stroke="url(#sweep)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="248" y="168" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, &#34;Segoe UI&#34;, Roboto, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5">Adminwright</text>
  <text x="248" y="208" fill="#8b949e" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, &#34;Segoe UI&#34;, Roboto, sans-serif" font-size="23">Agents build the admin console. The gate decides if it is real.</text>

  <g transform="translate(250 246)">
    <rect x="0" y="0" width="946" height="112" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="22" y="30" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="500">$ adminwright validate --phase release</text>
    <line x1="22" y1="46" x2="924" y2="46" stroke="#30363d" stroke-width="1"/>
    <text x="22" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="500"><tspan fill="#f85149">ERROR</tspan><tspan fill="#8b949e" xml:space="preserve">  placeholder-scan     dataBinding: 'mock database'</tspan></text>
    <text x="22" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="500"><tspan fill="#f85149">ERROR</tspan><tspan fill="#8b949e" xml:space="preserve">  lifecycle-reachable  state 'closed' has no command</tspan></text>
    <text x="646" y="72" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="500">no mock data</text>
    <text x="646" y="96" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="500">no orphan controls</text>
  </g>
</svg>
